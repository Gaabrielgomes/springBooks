spring.config.import=optional:file:.env[.properties]

spring.application.name=${APP_NAME:books}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}/${PG_DB_BOOKS:eltons_books}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PSWD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${SERVER_PORT:8889}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.open-in-view=false

jwt.service.key=${JWT_SERVICE_KEY}